name: Autonomous End-to-End QA & Continuous Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly regression test at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-and-validate:
    name: Build & Static Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ebook-sandy-chi.vercel.app
          ADMIN_ACCESS_SECRET: ${{ secrets.ADMIN_ACCESS_SECRET }}
          DOWNLOAD_ENCRYPTION_SECRET: ${{ secrets.DOWNLOAD_ENCRYPTION_SECRET }}

  autonomous-e2e-suite:
    name: Autonomous E2E, Browser & Security QA
    runs-on: ubuntu-latest
    needs: build-and-validate
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Playwright & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Execute Full API Regression & Security Audit
        run: |
          python -u projects/Autonomous_QA_System/tests/test_05_api_suite.py
        env:
          EBOOK_SITE_URL: https://ebook-sandy-chi.vercel.app
          ADMIN_ACCESS_SECRET: ${{ secrets.ADMIN_ACCESS_SECRET }}

      - name: Execute Playwright Real User Simulation & Responsive Test
        run: |
          python -u projects/Autonomous_QA_System/tests/test_playwright_e2e.py
        env:
          EBOOK_SITE_URL: https://ebook-sandy-chi.vercel.app

      - name: Archive QA Test Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-qa-artifacts
          path: |
            projects/Autonomous_QA_System/reports/
            projects/Autonomous_QA_System/screenshots/
          retention-days: 30
