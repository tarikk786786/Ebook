name: Resumable Free Cover Recovery

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anontrove-cover-recovery-main
  cancel-in-progress: false

jobs:
  recover-covers:
    name: Recover a small reviewable cover batch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 60 Pillow

      - name: Recover the next resumable batch
        run: python -u scripts/backfill_covers_free_apis.py --limit 120 --workers 4
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}

      - name: Commit recovered covers and cursor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/covers data/catalog/curated_masterclasses_from_pdf.json data/catalog/cover_backfill_summary.json data/catalog/cover_backfill_cursor.json
          if git diff --cached --quiet; then
            echo "No cover files or progress state changed in this batch."
            exit 0
          fi
          git commit -m "chore: recover next batch of ebook covers"
          git push origin HEAD:main
