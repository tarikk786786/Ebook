name: Security Audit & Automated Compliance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  semgrep:
    name: SAST Scanner (Semgrep OWASP)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep Rules
        run: |
          semgrep scan --config "p/owasp-top-ten" --config "p/javascript" --config "p/typescript" --config "p/react" --error --sarif --output semgrep.sarif || true

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  trivy:
    name: Dependency Vulnerability Scanner (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  build-verification:
    name: Next.js Compile & Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Type Check & Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ebook-sandy-chi.vercel.app
          ADMIN_ACCESS_SECRET: CI_SECURITY_TEST_SECRET_AT_LEAST_32_CHARS_LONG
          DOWNLOAD_ENCRYPTION_SECRET: CI_SECURITY_ENCRYPTION_SECRET_AT_LEAST_32_CHARS_LONG
          FAMGATEWAY_API_KEY: fam_ci_test_placeholder_key
